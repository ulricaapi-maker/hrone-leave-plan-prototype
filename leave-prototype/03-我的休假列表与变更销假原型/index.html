  {id:'L20260725008',type:'年假',period:'2026/07/25 — 2026/07/25',start:'2026-07-25',end:'2026-07-25',startText:'2026/07/25',endText:'2026/07/25',duration:'1天',unit:'天',reason:'家庭事务安排',status:'审批完成',approver:'—',follow:'—',created:'2026/07/20 15:42',archiveMode:'full'}
];
const cancelRows=[
  {id:'C20260808002',source:'L20260804004',type:'年假',period:'2026/08/04 — 2026/08/04',startText:'2026/08/04',endText:'2026/08/04',duration:'1天',unit:'天',reason:'休假计划取消',status:'审批完成',approver:'—',created:'2026/08/05 09:20'},
  {id:'C20260807001',source:'L20260801007',type:'调休假',period:'2026/08/11 09:00 — 2026/08/11 12:00',startText:'2026/08/11 09:00',endText:'2026/08/11 12:00',duration:'3小时',unit:'小时',reason:'提前返岗',status:'审批中',approver:'直属领导',created:'2026/08/07 18:02'},
  {id:'C20260801003',source:'L20260806002',type:'病假',period:'2026/08/10 — 2026/08/10',startText:'2026/08/10',endText:'2026/08/10',duration:'1天',unit:'天',reason:'无需继续休假',status:'已撤回',approver:'—',created:'2026/08/01 10:11'}
];
let activeTab='leave',selectedRow=null,pendingAction=null;
const $=id=>document.getElementById(id);
const statusClass=status=>({审批中:'tag-blue',审批完成:'tag-green',已撤回:'tag-gray',已驳回:'tag-red'}[status]||'tag-gray');
const tag=status=>`<span class="tag ${statusClass(status)}">${status}</span>`;
function actionButton(label,action,row,enabled,tip=''){const button=`<button class="btn-text" data-action="${action}" data-id="${row.id}" ${enabled?'':`disabled aria-disabled="true"`}>${label}</button>`;return enabled||!tip?button:`<span class="action-tip" tabindex="0" data-tip="${tip}">${button}</span>`}
function formatDateRanges(dates){const values=[...new Set((dates||[]).filter(Boolean))].sort();if(!values.length)return'—';const result=[];let start=values[0],previous=values[0];const nextDay=(from,to)=>(new Date(`${to}T00:00:00Z`)-new Date(`${from}T00:00:00Z`))===86400000;const output=value=>value.replaceAll('-','/');for(let index=1;index<=values.length;index++){const current=values[index];if(current&&nextDay(previous,current)){previous=current;continue}result.push(start===previous?output(start):`${output(start)}—${output(previous)}`);start=current;previous=current}return result.join('、')}
function cancelDisabledTip(row){if(row.follow==='销假审批中')return'暂不支持销假。原因：已有销假申请正在审批。';if(row.archiveMode==='partial'){const archived=formatDateRanges((row.daily||[]).filter(item=>item.archived).map(item=>item.date));const open=formatDateRanges((row.daily||[]).filter(item=>!item.archived).map(item=>item.date));return`暂不支持销假。原因：部分考勤日期已封存。已封存日期：${archived}；未封存日期：${open}。`}if(row.archiveMode==='full')return'暂不支持销假。原因：全部考勤日期已封存。';return''}
function getActions(row,kind){
  const canWithdraw=row.status==='审批中',canResubmit=row.status==='已撤回'||row.status==='已驳回';
  if(kind==='cancel')return [actionButton('撤回','withdraw',row,canWithdraw),actionButton('重新提交','resubmit',row,canResubmit)].join('');
  let canCancel=false;
  if(row.follow==='已销假'){}
  else if(row.follow==='销假审批中'){}
  else if(row.status!=='审批完成'){}
  else if(row.archiveMode==='partial'||row.archiveMode==='full'){}
  else canCancel=true;
  return [actionButton('销假','cancel',row,canCancel,cancelDisabledTip(row)),actionButton('撤回','withdraw',row,canWithdraw),actionButton('重新提交','resubmit',row,canResubmit)].join('');
}
function cancelStatus(row){return row.follow==='已销假'?'已销假':'未销假'}
function cancelStatusCell(row){if(cancelStatus(row)==='未销假')return '未销假';const cancelRow=cancelRows.find(item=>item.source===row.id&&item.status==='审批完成');return cancelRow?`<button class="btn-text" data-action="cancel-detail" data-id="${row.id}" data-cancel-id="${cancelRow.id}">已销假</button>`:'<span title="历史销假单据待关联">已销假</span>'}
function rowDate(value){return (value||'').replaceAll('/','-').slice(0,10)}
function filteredRows(){const source=activeTab==='leave'?leaveRows:cancelRows;const type=$('typeFilter').value,status=$('statusFilter').value,cancelState=$('cancelStatusFilter').value,startDate=$('startDateFilter').value,endDate=$('endDateFilter').value;return source.filter(row=>(!type||row.type===type)&&(!status||row.status===status)&&(activeTab!=='leave'||!cancelState||cancelStatus(row)===cancelState)&&(!startDate||rowDate(row.end||row.endText)>=startDate)&&(!endDate||rowDate(row.start||row.startText)<=endDate));}
function render(){
  const rows=filteredRows();
  $('listTitle').textContent=activeTab==='leave'?'休假申请列表':'销假申请列表';
  const datePrefix=activeTab==='leave'?'休假':'销假';$('startDateFilterLabel').textContent=`${datePrefix}开始日期`;$('endDateFilterLabel').textContent=`${datePrefix}结束日期`;
  $('cancelStatusFilterItem').style.display=activeTab==='leave'?'inline-flex':'none';
  $('addBtn').style.display=activeTab==='leave'?'inline-flex':'none';
  $('recordCount').textContent=`共 ${rows.length} 条记录，第 1/1 页`;
  if(activeTab==='leave'){
    $('tableWrap').innerHTML=`<table class="data-table"><thead><tr><th style="width:54px">序号</th><th style="width:95px">休假类别</th><th style="width:160px">开始时间</th><th style="width:160px">结束时间</th><th style="width:90px">休假时长</th><th style="width:180px">休假说明</th><th style="width:95px">审批状态</th><th style="width:95px">销假状态</th><th style="width:150px">申请时间</th><th style="width:230px">操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><button class="btn-text category-link" data-action="detail" data-id="${r.id}">${r.type}</button></td><td>${r.startText}</td><td>${r.endText}</td><td>${r.duration}</td><td><span class="reason-cell" title="${r.reason}">${r.reason}</span></td><td>${tag(r.status)}</td><td>${cancelStatusCell(r)}</td><td>${r.created}</td><td><div class="row-actions">${getActions(r,'leave')}</div></td></tr>`).join('')}</tbody></table>`;
  }else{
    $('tableWrap').innerHTML=`<table class="data-table cancel-table"><thead><tr><th style="width:54px">序号</th><th style="width:95px">休假类别</th><th style="width:160px">开始时间</th><th style="width:160px">结束时间</th><th style="width:90px">销假时长</th><th style="width:180px">申请事由</th><th style="width:95px">审批状态</th><th style="width:150px">申请时间</th><th style="width:100px">操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><button class="btn-text category-link" data-action="detail" data-id="${r.id}">${r.type}</button></td><td>${r.startText}</td><td>${r.endText}</td><td>${r.duration}</td><td><span class="reason-cell" title="${r.reason}">${r.reason}</span></td><td>${tag(r.status)}</td><td>${r.created}</td><td><div class="row-actions">${getActions(r,'cancel')}</div></td></tr>`).join('')}</tbody></table>`;
  }
  if(!rows.length)$('tableWrap').innerHTML='<div class="empty">暂无符合条件的记录</div>';
}
function openModal(id){$(id).classList.add('show')}
function closeModal(id){$(id).classList.remove('show')}
function showToast(message){$('toast').textContent=message;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openCancel(row){selectedRow=row;$('cancelSourceLink').textContent=`${row.id}　查看原休假详情`;$('cancelType').value=row.type;$('cancelStart').value=row.startText;$('cancelEnd').value=row.endText;$('cancelDuration').value=row.duration;$('cancelReason').value='';$('cancelReasonItem').classList.remove('invalid');$('fileName').textContent='最多上传5个文件';openModal('cancelModal')}
function openDetail(row,kind){const params=new URLSearchParams({kind,id:row.id,type:row.type,start:row.startText,end:row.endText,duration:row.duration,unit:row.unit||'',status:row.status,approver:row.approver,created:row.created,reason:row.reason||'',follow:row.follow||'—',source:row.source||'',archiveMode:row.archiveMode||'none'});window.location.href=`detail.html?${params.toString()}`}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeTab=btn.dataset.tab;$('statusFilter').value='';$('typeFilter').value='';$('cancelStatusFilter').value='';$('startDateFilter').value='';$('endDateFilter').value='';render()}));
$('tableWrap').addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const source=activeTab==='leave'?leaveRows:cancelRows;const row=source.find(item=>item.id===btn.dataset.id);if(!row)return;const action=btn.dataset.action;if(action==='detail')openDetail(row,activeTab);if(action==='cancel-detail'){const cancelRow=cancelRows.find(item=>item.id===btn.dataset.cancelId);if(cancelRow)openDetail(cancelRow,'cancel')}if(action==='cancel')openCancel(row);if(action==='withdraw'){selectedRow=row;pendingAction='withdraw';openModal('confirmModal')}if(action==='resubmit'){row.status='审批中';row.approver='直属领导';if(activeTab==='cancel'){const sourceLeave=leaveRows.find(item=>item.id===row.source);if(sourceLeave)sourceLeave.follow='销假审批中'}showToast('已重新提交');render()}});
$('queryBtn').addEventListener('click',render);$('resetBtn').addEventListener('click',()=>{$('typeFilter').value='';$('statusFilter').value='';$('cancelStatusFilter').value='';$('startDateFilter').value='';$('endDateFilter').value='';render()});
$('exportBtn').addEventListener('click',()=>showToast(`正在导出${activeTab==='leave'?'休假':'销假'}申请列表`));
$('addBtn').addEventListener('click',()=>{window.location.href='../02-休假申请本人原型/index.html'});
$('cancelSourceLink').addEventListener('click',()=>{if(selectedRow)openDetail(selectedRow,'leave')});
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeModal(btn.dataset.close)));
document.querySelectorAll('.overlay').forEach(mask=>mask.addEventListener('click',event=>{if(event.target===mask)closeModal(mask.id)}));
$('submitCancel').addEventListener('click',()=>{if(!$('cancelReason').value.trim()){$('cancelReasonItem').classList.add('invalid');return}selectedRow.follow='销假审批中';cancelRows.unshift({id:'C'+Date.now(),source:selectedRow.id,type:selectedRow.type,period:selectedRow.period,startText:selectedRow.startText,endText:selectedRow.endText,duration:selectedRow.duration,unit:selectedRow.unit,reason:$('cancelReason').value.trim(),status:'审批中',approver:'直属领导',created:'2026/08/08 16:30'});closeModal('cancelModal');render();showToast('销假申请已提交')});
$('uploadBtn').addEventListener('click',()=>{$('fileName').textContent='销假说明.pdf';showToast('已选择文件')});
$('confirmAction').addEventListener('click',()=>{if(pendingAction==='withdraw'&&selectedRow){selectedRow.status='已撤回';selectedRow.approver='—';if(activeTab==='cancel'){const sourceLeave=leaveRows.find(item=>item.id===selectedRow.source);if(sourceLeave)sourceLeave.follow='—'}closeModal('confirmModal');render();showToast('申请已撤回')}});
const incomingParams=new URLSearchParams(window.location.search);if(incomingParams.get('tab')==='cancel'){activeTab='cancel';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='cancel'))}render();
const detailId=incomingParams.get('openDetail');if(detailId){const detailRow=leaveRows.find(item=>item.id===detailId);if(detailRow)openDetail(detailRow,'leave')}
const incomingAction=incomingParams.get('action'),incomingId=incomingParams.get('id');if(incomingAction&&incomingId){const incomingSource=activeTab==='leave'?leaveRows:cancelRows;const incomingRow=incomingSource.find(item=>item.id===incomingId);if(incomingRow){if(incomingAction==='cancel')openCancel(incomingRow);if(incomingAction==='withdraw'){selectedRow=incomingRow;pendingAction='withdraw';openModal('confirmModal')}if(incomingAction==='resubmit'){incomingRow.status='审批中';incomingRow.approver='直属领导';render();showToast('已重新提交')}}history.replaceState({},'',activeTab==='cancel'?'index.html?tab=cancel':'index.html')}
</script>
