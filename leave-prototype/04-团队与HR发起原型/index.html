<body>
<div class="layout">
  <aside class="sidebar"><div class="sidebar-logo">HR One</div><div id="sideNav"></div></aside>
  <main class="main">
    <header class="header"><div class="breadcrumb" id="breadcrumb"></div><div class="user-info" id="userInfo"></div></header>
    <section class="content">
      <h1 class="page-title" id="pageTitle">团队休假</h1>
      <nav class="tabs" aria-label="休假业务类型"><button class="tab active" data-tab="leave">休假</button><button class="tab" data-tab="cancel">销假</button></nav>
      <section class="search-bar">
        <div class="search-item employee"><label>员工</label><button class="person-picker" type="button" id="employeePicker"><span class="person-picker-avatar" id="employeePickerAvatar">员</span><span class="person-picker-text" id="employeePickerText">请选择员工</span><span class="person-picker-clear" id="employeePickerClear" aria-label="清除员工">×</span></button><input id="employeeFilter" type="hidden"></div>
        <div class="search-item"><label>部门</label><select id="departmentFilter"><option value="">全部</option><option>产品研发部</option><option>客户成功部</option><option>财务共享部</option><option>人力资源部</option></select></div>
        <div class="search-item"><label>划分区域</label><select id="regionFilter"><option value="">全部</option><option>中国区</option><option>海外区</option></select></div>
        <div class="search-item"><label>休假类别</label><select id="typeFilter"><option value="">全部</option><option>年假</option><option>调休假</option><option>病假</option><option>婚假</option></select></div>
        <span class="query-break" aria-hidden="true"></span>
        <div class="search-item"><label>审批状态</label><select id="statusFilter"><option value="">全部</option><option>审批中</option><option>审批完成</option><option>已撤回</option><option>已驳回</option></select></div>
        <div class="search-item" id="cancelStatusFilterItem"><label>销假状态</label><select id="cancelStatusFilter"><option value="">全部</option><option>已销假</option><option>未销假</option></select></div>
        <div class="search-item date"><label id="startDateFilterLabel">休假开始日期</label><input id="startDateFilter" type="date"></div>
        <div class="search-item date"><label id="endDateFilterLabel">休假结束日期</label><input id="endDateFilter" type="date"></div>
        <div class="search-actions"><button class="btn btn-primary" id="queryBtn">查询</button><button class="btn" id="resetBtn">重置</button></div>
      </section>
      <section class="card">

<script>

function showToast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}

function openCancel(row){selectedCancelRow=row;$('cancelEmployee').value=`${row.employee}（${row.employeeId}）`;$('cancelSourceLink').textContent=`${row.id}　查看原休假详情`;$('cancelType').value=row.type;$('cancelStart').value=row.start;$('cancelEnd').value=row.end;$('cancelDuration').value=row.duration;$('cancelReason').value='';$('cancelReasonItem').classList.remove('invalid');$('cancelFileName').textContent='最多上传5个文件';openModal('cancelModal')}

function formatDateRanges(dates){const values=[...new Set((dates||[]).filter(Boolean))].sort();if(!values.length)return'—';const result=[];let start=values[0],previous=values[0];const nextDay=(from,to)=>(new Date(`${to}T00:00:00Z`)-new Date(`${from}T00:00:00Z`))===86400000;const output=value=>value.replaceAll('-','/');for(let index=1;index<=values.length;index++){const current=values[index];if(current&&nextDay(previous,current)){previous=current;continue}result.push(start===previous?output(start):`${output(start)}—${output(previous)}`);start=current;previous=current}return result.join('、')}
function cancelDisabledTip(row){if(row.follow==='销假审批中')return'暂不支持销假。原因：已有销假申请正在审批。';if(row.archiveMode==='partial'){const archived=formatDateRanges((row.daily||[]).filter(item=>item.archived).map(item=>item.date));const open=formatDateRanges((row.daily||[]).filter(item=>!item.archived).map(item=>item.date));return`暂不支持销假。原因：部分考勤日期已封存。已封存日期：${archived}；未封存日期：${open}。`}if(row.archiveMode==='full')return'暂不支持销假。原因：全部考勤日期已封存。';return''}

function openDetail(id){const row=sourceRows().find(item=>item.id===id);if(!row)return;const detailParams=new URLSearchParams({kind:activeTab,id:row.id,type:row.type,start:row.start,end:row.end,duration:row.duration,unit:row.duration.includes('天')?'天':'小时',status:row.status,approver:row.approver||'—',created:row.created,reason:row.reason,follow:row.follow||'—',archiveMode:row.archiveMode||'none',employee:row.employee,employeeId:row.employeeId,initiator:row.initiator,entryMode:mode});if(row.source)detailParams.set('source',row.source);window.location.href=`../03-我的休假列表与变更销假原型/detail.html?${detailParams}`}

$('tableWrap').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;event.stopImmediatePropagation();const row=sourceRows().find(item=>item.id===button.dataset.id);if(!row)return;const action=button.dataset.action;if(action==='detail'){openDetail(row.id);return}if(action==='cancel-detail'){const cancelRow=(mode==='team'?teamCancelRows:hrCancelRows).find(item=>item.id===button.dataset.cancelId);if(cancelRow){const previousTab=activeTab;activeTab='cancel';openDetail(cancelRow.id);activeTab=previousTab}return}if(action==='withdraw'){row.status='已撤回';if(activeTab==='cancel'){const sourceLeave=(mode==='team'?teamRows:hrRows).find(item=>item.id===row.source);if(sourceLeave)sourceLeave.follow='—'}showToast('申请已撤回');render();return}if(action==='resubmit'){row.status='审批中';if(activeTab==='cancel'){const sourceLeave=(mode==='team'?teamRows:hrRows).find(item=>item.id===row.source);if(sourceLeave)sourceLeave.follow='销假审批中'}showToast('申请已重新提交');render();return}if(action==='cancel')openCancel(row)},true);
